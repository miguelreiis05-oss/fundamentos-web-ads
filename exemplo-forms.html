<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Formulário HTML</title>
</head>
<body>
    <header>
        <h1>Página de cadastro - Exemplo</h1>
    </header>
    <main style="color: rgb(122, 122, 240);">
        <section>
            <form id="registerForm" method="POST">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required />

                <br>

                <label for="email">Informe seu e-mail:</label>
                <input type="email" id="email" name="email" required />

                <br>

                <label for="senha">Informe sua senha:</label>
                <input id="senha" name="senha" type="password" required  
                minlength="8" maxlength="12"/>

                <br>

                <input type="text" id="cpf" name="cpf" 
                pattern="/d{3}\./d{3}\./d{3}\-\d{2}"
                placeholder="000.000.000-00"
                title="Formato esperado: 000.000.000-00"/>

                <br>

                <textarea id="mensagem" name="mensagem" rows="4"
                cols="30" placeholder="Digite o texto"></textarea>

                <br>

                <label for="evento">Escolha seu evento:</label>
                <select id="evento" name="evento">
                    <option value="Rock">Show Rock</option>
                    <option value="Sertanejo">Show Sertanejo</option>
                    <option value="Jogos">Jogo Universitário</option>
                </select>

                <br>

                <label for="termos" >
                    <input id="termos" name="termos" type="checkbox" required/>
                    Concordo com os termos de uso
                </label>

                <br>

                <label>
                    <input type="radio" value="pix" name="pagamento"/>Pix
                </label>
                <label>
                    <input type="radio" value="Cartao" name="pagamento"/>Cartao
                </label>
                <br>
                <input type="number" step="5"/>

                <br>

                <input type="submit" value="Cadastrar" />
            </form>

        </section>
    </main>
    <br>
    <footer>
        <p>&copy; Desenvolvido por Miguel</p>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const cpf = document.getElementById('cpf').value;
            const email = document.getElementById('email').value;

            alert(`Cadastro recebido!\nNome: ${nome}\nCPF: ${cpf}\nE-mail: ${email}`);
        });
    </script>
    
</body>
</html>
